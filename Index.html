<body>
<div id="login">

      <div class="top">
        <div class="marca"><b>Pozo del Carril</b> · La Aguada · Ovinos Dorper</div>

      <button onclick="salir()">↩ Salir</button>
    </div>
  </header>
  <main id="main"></main>

<script>
var S = { token:null, u:null, esq:null, listas:null, resumen:null, vista:'inicio' };
try { S.token = sessionStorage.getItem('ovToken'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
if (typeof FOTO !== 'undefined') { $('loginFoto').style.backgroundImage = 'url(' + FOTO + ')'; $('heroImg').src = FOTO; }
if (typeof LOGO !== 'undefined') $('logoPie').src = LOGO;

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var runner = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      var m = (e && e.message) || String(e);
      if (/Sesión vencida/.test(m)) { salir(true); }
      rej(new Error(m));
    });
    runner[fn].apply(runner, args);
  });
}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function pesos(x) { return x === null || x === undefined || x === '' ? '—' : '$ ' + Number(x).toLocaleString('es-AR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function pesos0(x) { return '$ ' + Number(x).toLocaleString('es-AR', { maximumFractionDigits:2 }); }
function dolarHoy() { return S.resumen && S.resumen.dolar ? Number(S.resumen.dolar.Vendedor) : 0; }
function enUSD(x) { var d = dolarHoy(); return d ? 'US$ ' + Number(x / d).toLocaleString('es-AR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : ''; }
function num(x, d) { return x === null || x === undefined || x === '' ? '—' : Number(x).toLocaleString('es-AR', { maximumFractionDigits: d === undefined ? 2 : d }); }
function msg(el, tipo, t) { if (el) el.innerHTML = '<div class="msg ' + tipo + '">' + esc(t) + '</div>'; }
function hoy() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fecha(s) { if (!s) return '—'; var p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }
function fechaLarga() { var t = new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); }
function L(t) { return S.listas[t] || []; }
function etiqueta(tabla, id) { var l = L(tabla).filter(function (x) { return String(x.id) === String(id); })[0]; return l ? l.label : id; }
function item(tabla, id) { return L(tabla).filter(function (x) { return String(x.id) === String(id); })[0] || null; }
function puede(t, a) { return S.esq[t] && S.esq[t].puede[a]; }
function opciones(lista, sel, vacio) { return (vacio === false ? '' : '<option value="">' + (vacio || '— elegir —') + '</option>') + lista.map(function (o) { return '<option value="' + esc(o.id) + '"' + (String(o.id) === String(sel) ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join(''); }
function pills(id, ops, sel) { return '<div class="pills" id="' + id + '">' + ops.map(function (o) { var v = typeof o === 'string' ? o : o[0], l = typeof o === 'string' ? o : o[1]; return '<button type="button" class="pill' + (v === sel ? ' on' : '') + '" data-v="' + esc(v) + '" onclick="pillSel(this)">' + esc(l) + '</button>'; }).join('') + '</div>'; }
function pillSel(b) { Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); var ev = b.parentNode.getAttribute('data-on'); if (ev && window[ev]) window[ev](b.getAttribute('data-v')); }
function pillVal(id) { var b = $(id) && $(id).querySelector('.pill.on'); return b ? b.getAttribute('data-v') : ''; }
function campo(lab, html, ayuda, req) { return '<div class="f"><label>' + lab + (req ? ' <span class="req">*</span>' : '') + '</label>' + html + (ayuda ? '<div class="ay">' + ayuda + '</div>' : '') + '</div>'; }
function nombreCat(id) { return etiqueta('D_Categoria', id); }
function activos() { return L('D_Animal').filter(function (a) { return a.estado === 'Activo'; }); }
function listo(titulo, texto, otraVista, otraTxt) {
  $('main').innerHTML = volverBtn() + '<div class="card listo"><div class="ch">✓</div><h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p><div class="row" style="justify-content:center">' +
    (otraVista ? '<button class="btn2" onclick="ir(\'' + otraVista + '\')">' + esc(otraTxt) + '</button>' : '') + '<button class="btn" onclick="ir(\'inicio\')">Volver al inicio</button></div></div>';
  window.scrollTo(0, 0);
}
function volverBtn() { return '<button class="volver" onclick="ir(\'inicio\')">← Inicio</button>'; }
function ocupado(btn, si) { if (btn) { btn.disabled = si; if (si) { btn._t = btn.textContent; btn.textContent = 'Guardando…'; } else if (btn._t) btn.textContent = btn._t; } }

/* ---------- Sesión ---------- */
function ingresar() {
  var b = $('lBtn'); b.disabled = true;
  call('api_login', $('lEmail').value, $('lClave').value).then(function (r) {
    S.token = r.token; try { sessionStorage.setItem('ovToken', r.token); } catch (e) {}
    return iniciar();
  }).catch(function (e) { msg($('loginMsg'), 'err', e.message); }).then(function () { b.disabled = false; });
}
$('lClave').addEventListener('keydown', function (e) { if (e.key === 'Enter') ingresar(); });
function salir(silencioso) {
  if (S.token && !silencioso) call('api_logout', S.token).catch(function () {});
  S.token = null; try { sessionStorage.removeItem('ovToken'); } catch (e) {}
  $('menuU').classList.add('hide'); $('app').classList.add('hide'); $('login').classList.remove('hide');
  if (silencioso) msg($('loginMsg'), 'warn', 'La sesión venció. Volvé a entrar.');
}
function iniciar() {
  return call('api_inicio', S.token).then(function (r) {
    S.u = r.usuario; S.esq = r.esquema; S.listas = r.listas; S.resumen = r.resumen; S.rubros = r.rubros;
    var ini = String(S.u.Nombre || '?').trim().split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();
    $('avU').textContent = ini; $('nmU').innerHTML = esc(S.u.Nombre) + '<small>' + esc(S.u.Rol) + (S.u.IdSubunidad ? ' · ' + esc(etiqueta('D_Subunidad', S.u.IdSubunidad)) : '') + '</small>';
    $('heroFecha').textContent = fechaLarga(); $('verPie').textContent = 'Versión ' + r.version;
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    ir(S.vista);
  });
}
function refrescar() { return call('api_inicio', S.token).then(function (r) { S.listas = r.listas; S.esq = r.esquema; S.resumen = r.resumen; }); }
function menuUsuario() { $('menuU').classList.toggle('hide'); }
document.addEventListener('click', function (e) { if (!e.target.closest('#chipU') && !e.target.closest('#menuU')) $('menuU').classList.add('hide'); });

var VISTAS = {
  inicio:    ['', vInicio], sanidad: ['Vacunas y tratamientos', vSanidad], nacimiento: ['Nació un cordero', vNacimiento],
  muerte:    ['Murió un animal', vMuerte], compra: ['Cargar una compra', vCompra], compras: ['Cobros y pagos', vCuentas], cuentas: ['Cobros y pagos', vCuentas],
  venta:     ['Vender animales', vVenta], terceros: ['Proveedores y clientes', vTerceros], animales: ['Los animales', vAnimales],
  tablero:   ['Resultados', vTablero], tablas: ['Administración', vTablas], clave: ['Cambiar mi clave', vClave]
};
function ir(v) {
  if (!VISTAS[v]) v = 'inicio';
  S.vista = v; $('menuU').classList.add('hide');
  $('hero').classList.toggle('big', v === 'inicio');
  var h = new Date().getHours(), saludo = h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  $('heroTit').textContent = v === 'inicio' ? saludo + ', ' + String(S.u.Nombre).split(' ')[0] : VISTAS[v][0];
  window.scrollTo(0, 0);
  VISTAS[v][1]();
}

/* ---------- INICIO ---------- */

    '<div class="res" onclick="ir(\'animales\')"><div class="v">' + num(r.rodeo, 0) + '</div><div class="l">animales en el rodeo</div></div>' +

    '<div class="res' + (r.comprasVencidas ? ' alerta' : r.comprasPendientes ? ' aviso' : '') + '" onclick="ir(\'cuentas\')"><div class="v">' + num(r.comprasPendientes, 0) + '</div><div class="l">facturas por pagar' + (r.comprasVencidas ? ' · ' + r.comprasVencidas + ' vencida' + (r.comprasVencidas > 1 ? 's' : '') : '') + (r.porCobrar ? ' · ' + r.porCobrar + ' venta' + (r.porCobrar > 1 ? 's' : '') + ' por cobrar' : '') + '</div></div>' +
    '<div class="res dolar"' + (S.u.Rol === 'Administrador' ? ' onclick="dolarAhora(this)" title="Tocá para buscar la cotización de hoy"' : '') + '><div class="v">' + (r.dolar ? pesos0(r.dolar.Vendedor) : '—') + '</div><div class="l">' + (r.dolar ? 'dólar oficial BNA (vendedor) · ' + fecha(r.dolar.Fecha) : 'dólar BNA: todavía sin cotización') + '</div></div>' +
    '</div>';
  var t = function (v, ic, tit, sub, carga) { return '<button class="tile' + (carga ? ' carga' : '') + '" onclick="ir(\'' + v + '\')"><span class="ic">' + ic + '</span><span><b>' + tit + '</b><span>' + sub + '</span></span></button>'; };
  var carga = [];
  if (puede('F_Sanidad', 'crear')) carga.push(t('sanidad', '💉', 'Vacuné o traté animales', 'Vacunas, antiparasitarios, remedios', 1));
  if (puede('D_Animal', 'crear')) carga.push(t('nacimiento', '🐑', 'Nació un cordero', 'Alta de un animal nuevo', 1));
  if (puede('F_Mortandad', 'crear')) carga.push(t('muerte', '🕊️', 'Murió un animal', 'Sacarlo del rodeo y anotar la causa', 1));
  if (puede('F_Compras', 'crear')) carga.push(t('compra', '🧾', 'Cargué una compra', 'Factura de un proveedor', 1));
  if (puede('F_Ingresos', 'crear')) carga.push(t('venta', '💰', 'Vendí animales', 'Factura de venta y salida del rodeo', 1));
  if (puede('F_Tesoreria', 'crear')) carga.push(t('cuentas', '💵', 'Cobré o pagué algo', 'Recibos, lo que se debe y lo que nos deben', 1));
  var ver = [t('animales', '🐏', 'Ver los animales', 'Rodeo, fichas y tratamientos'), 
    t('terceros', '🤝', 'Proveedores y clientes', puede('D_Tercero', 'crear') ? 'Ver y agregar' : 'Ver la lista'), t('tablero', '📊', 'Resultados', 'Ingresos, costos y margen')];
  if (!puede('F_Tesoreria', 'crear')) ver.splice(1, 0, t('cuentas', '📋', 'Cobros y pagos', 'Facturas, lo que se debe y lo que nos deben'));
  if (S.u.Rol === 'Administrador') ver.push(t('tablas', '⚙️', 'Administración', 'Tablas, parámetros y usuarios'));
  if (carga.length) h += '<div class="seccion">¿Qué hiciste hoy?</div><div class="tiles t3">' + carga.join('') + '</div>';
  h += '<div class="seccion">Consultar</div><div class="tiles">' + ver.join('') + '</div>';
  $('main').innerHTML = h;
}

/* ---------- Selector de animales (para sanidad) ---------- */
var SEL = {};
function selectorAnimales(soloSub) {
  var grupos = {};
  activos().forEach(function (a) {
    var cat = item('D_Categoria', a.cat);
    if (soloSub && cat && cat.sub !== soloSub) return;
    var n = nombreCat(a.cat); (grupos[n] = grupos[n] || []).push(a);
  });
  var orden = ['Oveja', 'Carnero', 'Cordero', 'Borrego', 'Borrega'];
  var claves = Object.keys(grupos).sort(function (a, b) { return (orden.indexOf(a) + 99) % 99 - (orden.indexOf(b) + 99) % 99; });
  if (!claves.length) return '<p class="muted">No hay animales en el rodeo.</p>';
  return '<div class="row" style="margin-bottom:10px"><button type="button" class="btn2" onclick="selTodos(true)">Elegir todo el rodeo</button><button type="button" class="btn2" onclick="selTodos(false)">Ninguno</button></div>' +
    claves.map(function (g) {
      var lista = grupos[g].sort(function (a, b) { return Number(a.id) - Number(b.id); });
      return '<div class="grupoA"><div class="gh"><b>' + esc(g) + (lista.length === 1 ? '' : g.slice(-1) === 'o' || g.slice(-1) === 'a' ? 's' : 'es') + ' (' + lista.length + ')</b><button type="button" class="btn2" onclick="selGrupo(\'' + esc(g) + '\')">Todas/os</button></div><div class="cars">' +
        lista.map(function (a) { return '<button type="button" class="car' + (SEL[a.id] ? ' on' : '') + (a.carencia ? ' cr' : '') + '" data-g="' + esc(g) + '" data-id="' + a.id + '" title="' + (a.carencia ? 'En carencia hasta ' + fecha(a.carencia) : '') + '" onclick="selUno(this)">' + a.id + '</button>'; }).join('') + '</div></div>';
    }).join('') + '<p class="muted">El punto rojo indica un animal que ya está en carencia por otro tratamiento.</p>';
}
function selUno(b) { var id = b.getAttribute('data-id'); SEL[id] = !SEL[id]; b.classList.toggle('on', !!SEL[id]); selContar(); }
function selGrupo(g) { var bs = document.querySelectorAll('.car[data-g="' + g + '"]'); var todos = Array.prototype.every.call(bs, function (b) { return SEL[b.getAttribute('data-id')]; }); Array.prototype.forEach.call(bs, function (b) { SEL[b.getAttribute('data-id')] = !todos; b.classList.toggle('on', !todos); }); selContar(); }
function selTodos(si) { Array.prototype.forEach.call(document.querySelectorAll('.car'), function (b) { SEL[b.getAttribute('data-id')] = si; b.classList.toggle('on', si); }); selContar(); }
function selElegidos() { return Object.keys(SEL).filter(function (k) { return SEL[k]; }); }
function selContar() { var n = selElegidos().length; if ($('selN')) $('selN').textContent = n ? n + ' animal' + (n === 1 ? '' : 'es') + ' elegido' + (n === 1 ? '' : 's') : 'Todavía no elegiste animales'; sTotal(); }

/* ---------- Producto nuevo (alta rápida, se usa en sanidad y compras) ---------- */
function productoSelect(id, rubro, sel, onchange) {
  var ins = L('D_Insumo').filter(function (x) { return !rubro || x.rubro === rubro; });
  return '<select id="' + id + '" onchange="' + (onchange || '') + '">' + opciones(ins, sel) + (puede('D_Insumo', 'crear') ? '<option value="__nuevo">＋ Agregar un producto nuevo…</option>' : '') + '</select>';
}
function productoNuevoHTML(pref, rubro) {
  var ums = L('D_UM').filter(function (u) { return ['mL', 'L', 'ds', 'kg', 'g', 'un', 'cab', 'km', 'h', 'J', 'bol', 'd'].indexOf(u.abrev) >= 0; });
  return '<div class="mini" id="' + pref + 'Nuevo"><b>Producto nuevo</b><div id="' + pref + 'NMsg"></div>' +
    campo('Nombre del producto', '<input id="' + pref + 'NNom" placeholder="ej. Ivermectina 1% x 500 mL">', '', 1) +
    (rubro ? '' : campo('¿Para qué es?', pills(pref + 'NRub', S.rubros, ''), 'Con esto el sistema sabe en qué cuenta del plan de cuentas va.', 1)) +
    '<div class="row">' + campo('Se usa en', '<select id="' + pref + 'NUm">' + opciones(ums.map(function (u) { return { id: u.id, label: u.label + ' (' + u.abrev + ')' }; }), (L('D_UM').filter(function (u) { return u.abrev === (rubro === 'Sanidad' ? 'mL' : 'un'); })[0] || {}).id, false) + '</select>', 'La unidad en que se mide cada aplicación o uso', 1) +
    campo('Cuánto trae cada envase', '<input id="' + pref + 'NCont" type="number" step="any" inputmode="decimal" placeholder="ej. 500">', 'Opcional (ej. un frasco de 500 mL)') + '</div>' +
    '<div class="row"><button type="button" class="btn" onclick="productoGuardar(\'' + pref + '\',\'' + (rubro || '') + '\')">Agregar producto</button><button type="button" class="btn2" onclick="productoCancelar(\'' + pref + '\')">Cancelar</button></div></div>';
}
function productoGuardar(pref, rubro) {
  var o = { Nombre: $(pref + 'NNom').value, Rubro: rubro || pillVal(pref + 'NRub'), IdUM: $(pref + 'NUm').value, ContenidoEnvase: $(pref + 'NCont').value };
  if (!o.Nombre || !o.Rubro) { msg($(pref + 'NMsg'), 'err', 'Completá el nombre' + (rubro ? '' : ' y para qué es') + '.'); return; }
  call('api_crear', S.token, 'D_Insumo', o).then(function (r) {
    return refrescar().then(function () { var cont = $(pref + 'NuevoWrap'); if (cont) cont.innerHTML = ''; var s = $(pref); if (s) { s.outerHTML = productoSelect(pref, rubro, r.id, s.getAttribute('onchange')); } if (window[pref + 'Cambio']) window[pref + 'Cambio'](); });
  }).catch(function (e) { msg($(pref + 'NMsg'), 'err', e.message); });
}
function productoCancelar(pref) { var c = $(pref + 'NuevoWrap'); if (c) c.innerHTML = ''; var s = $(pref); if (s) s.value = ''; }

    '<div style="height:12px"></div><div class="row">' + campo('Producto', productoSelect('sProd', 'Sanidad', '', 'sProdCambio()'), '', 1) +

function sProdCambio() {
  var v = $('sProd').value;
  if (v === '__nuevo') { $('sProdNuevoWrap').innerHTML = productoNuevoHTML('sProd', 'Sanidad'); $('sUm').textContent = ''; return; }
  $('sProdNuevoWrap').innerHTML = ''; sTotal();
}
window.sProdCambio = sProdCambio;
function sUmDe(id) { var p = item('D_Insumo', id); if (!p) return ''; var u = item('D_UM', p.um); return u ? u.abrev : ''; }
function sTotal() {
  if (!$('sTot')) return;
  var p = $('sProd') ? $('sProd').value : '', um = sUmDe(p), d = Number($('sDosis').value) || 0, n = selElegidos().length;
  $('sUm').textContent = p && p !== '__nuevo' ? 'En ' + (um || 'la unidad del producto') + ' por animal' : 'Elegí el producto';
  var pr = item('D_Insumo', p), t = d * n;
  $('sTot').textContent = d && n ? 'Total a usar: ' + num(t) + ' ' + um + (pr && pr.contenido ? ' (≈ ' + num(t / pr.contenido, 1) + ' envase' + (t / pr.contenido > 1 ? 's' : '') + ')' : '') : '';
}
function sGuardar() {
  var s = { TipoEvento: pillVal('sTipo'), IdInsumo: $('sProd').value, Dosis: $('sDosis').value, DiasCarencia: $('sCar').value, Fecha: $('sFecha').value,
    Responsable: $('sResp').value, Observaciones: $('sObs').value, caravanas: selElegidos() };
  var falta = [];
  if (!s.TipoEvento) falta.push('qué hiciste'); if (!s.IdInsumo || s.IdInsumo === '__nuevo') falta.push('el producto'); if (s.Dosis === '') falta.push('la dosis');
  if (s.DiasCarencia === '') falta.push('los días de carencia'); if (!s.caravanas.length) falta.push('los animales');
  if (falta.length) { msg($('sMsg'), 'err', 'Falta completar: ' + falta.join(', ') + '.'); $('sMsg').scrollIntoView({ behavior:'smooth', block:'center' }); return; }
  var b = $('sBtn'); ocupado(b, true);
  call('api_registrarSanidad', S.token, s).then(function (r) {
    return refrescar().then(function () { listo('Tratamiento guardado', r.mensaje, 'sanidad', 'Cargar otro tratamiento'); });
  }).catch(function (e) { msg($('sMsg'), 'err', e.message); $('sMsg').scrollIntoView({ behavior:'smooth', block:'center' }); ocupado(b, false); });
}
function sHistorial() {
  call('api_listar', S.token, 'F_Sanidad').then(function (rows) {
    rows = rows.filter(function (x) { return x.Activo !== 'No'; });
    if (!rows.length) { $('sHist').innerHTML = 'Todavía no hay tratamientos cargados.'; return; }
    var jor = {};
    rows.forEach(function (x) { var k = x.IdEvento || x.IdSanidad; (jor[k] = jor[k] || []).push(x); });
    var ks = Object.keys(jor).sort(function (a, b) { return jor[b][0].Fecha < jor[a][0].Fecha ? -1 : 1; }).slice(0, 15);
    var h = hoy();
    $('sHist').innerHTML = '<div class="lista">' + ks.map(function (k) {
      var g = jor[k], x = g[0], vig = x.FinCarencia > h;
      return '<div class="item"><div class="t"><b>' + esc(x.TipoEvento) + ' · ' + esc(etiqueta('D_Insumo', x.IdInsumo)) + '</b><div>' + fecha(x.Fecha) + ' · ' + g.length + ' animal' + (g.length === 1 ? '' : 'es') + ' · ' + num(x.Dosis) + ' ' + sUmDe(x.IdInsumo) + ' c/u · ' + esc(x.Responsable) + '</div><div>Caravanas: ' + g.map(function (y) { return y.Caravana; }).join(', ') + '</div></div>' +
        '<div class="der">' + (Number(x.DiasCarencia) > 0 ? (vig ? '<span class="tag r">En carencia hasta ' + fecha(x.FinCarencia) + '</span>' : '<span class="tag v">Carencia cumplida</span>') : '<span class="tag g">Sin carencia</span>') + '</div></div>';
    }).join('') + '</div>';
  }).catch(function (e) { msg($('sHist'), 'err', e.message); });
}

  $('main').innerHTML = h;

function nGuardar() {
  var o = { Caravana: $('nCar').value, IdCategoria: $('nCat').value, FechaNac: $('nFecha').value, PesoKg: $('nPeso').value, Sexo: pillVal('nSexo'),

/* ---------- MUERTE ---------- */
function vMuerte() {
  var an = activos().map(function (a) { return { id: a.id, label: 'Caravana ' + a.id + ' · ' + nombreCat(a.cat) }; }).sort(function (a, b) { return a.id - b.id; });
  var h = volverBtn() + '<div class="card"><h2>Murió un animal</h2><p class="sub">El animal sale del rodeo y queda anotada la causa. Si te equivocaste, el administrador lo puede anular.</p><div id="mMsg"></div>' +
    '<div class="row">' + campo('¿Qué animal?', '<select id="mCar">' + opciones(an) + '</select>', '', 1) + campo('Fecha', '<input id="mFecha" type="date" value="' + hoy() + '" max="' + hoy() + '">', '', 1) + '</div>' +
    campo('¿De qué murió?', pills('mCausa', ['Enfermedad', 'Parto', 'Accidente', 'Predador', 'Clima', 'No se sabe', 'Otra'], ''), '', 1) +
    campo('Observaciones', '<textarea id="mObs" placeholder="Opcional"></textarea>') +
    '<button class="btn full" id="mBtn" onclick="mGuardar()">Registrar muerte</button></div>';
  $('main').innerHTML = h;
}
function mGuardar() {
  var o = { Caravana: $('mCar').value, Fecha: $('mFecha').value, Causa: pillVal('mCausa'), Observaciones: $('mObs').value };
  if (!o.Caravana || !o.Causa) { msg($('mMsg'), 'err', 'Elegí el animal y la causa.'); return; }

  var b = $('mBtn'); ocupado(b, true);
  call('api_registrarMuerte', S.token, o).then(function (r) { return refrescar().then(function () { listo('Registrado', r.mensaje); }); })
    .catch(function (e) { msg($('mMsg'), 'err', e.message); ocupado(b, false); });

    h += '<div class="card"><h2>Rodeo (hoy)</h2><table><tr><th>Categoría</th><th class="n">En el rodeo</th><th class="n">Vendidos</th><th class="n">Muertos</th></tr>';
    var tA = 0; r.stock.forEach(function (s) { tA += s.activos; h += '<tr><td>' + esc(s.categoria) + '</td><td class="n">' + s.activos + '</td><td class="n">' + s.vendidos + '</td><td class="n">' + s.muertos + '</td></tr>'; });
    h += '<tr class="tot"><td>Rodeo activo</td><td class="n">' + tA + '</td><td></td><td></td></tr></table></div>';

    h += '<div class="card"><h2>Verificación: de dónde sale cada número</h2><details><summary>Ingresos (' + r.detalleIngresos.length + ' renglones)</summary><div class="scroll"><table><tr><th>Id</th><th>Fecha</th><th>Comprobante</th><th>Caravana</th><th>Etapa</th><th class="n">Kg</th><th class="n">$/kg</th><th>Con IVA</th><th class="n">Neto</th><th class="n">IVA</th><th class="n">Total</th></tr>';
    var t = { kg:0, neto:0, iva:0, tot:0 };
    r.detalleIngresos.forEach(function (x) { t.kg += +x.Kg; t.neto += +x.ImporteNeto; t.iva += +x.IVA; t.tot += +x.Total;
      h += '<tr><td>' + esc(x.IdIngreso) + '</td><td>' + fecha(x.Fecha) + '</td><td>' + esc(x.Comprobante) + '</td><td>' + esc(x.Caravana) + '</td><td>' + esc(etiqueta('D_Subunidad', x.IdSubunidad)) + '</td><td class="n">' + num(x.Kg) + '</td><td class="n">' + num(x.PrecioKg) + '</td><td>' + esc(x.PrecioIncluyeIVA) + '</td><td class="n">' + pesos(x.ImporteNeto) + '</td><td class="n">' + pesos(x.IVA) + '</td><td class="n">' + pesos(x.Total) + '</td></tr>'; });
    h += '<tr class="tot"><td colspan="5">Total</td><td class="n">' + num(t.kg) + '</td><td></td><td></td><td class="n">' + pesos(t.neto) + '</td><td class="n">' + pesos(t.iva) + '</td><td class="n">' + pesos(t.tot) + '</td></tr></table></div></details>';
    h += '<details><summary>Costos (' + r.detalleCostos.length + ' renglones)</summary><div class="scroll"><table><tr><th>Id</th><th>Fecha</th><th>Comprobante</th><th>Insumo</th><th>Tipo</th><th>Etapa</th><th class="n">Cantidad</th><th class="n">Precio unit.</th><th class="n">Importe</th><th>Supuesto</th><th>Fuente</th></tr>';
    r.detalleCostos.forEach(function (x) { h += '<tr class="' + (x.EsSupuesto === 'Sí' ? 'sup' : '') + '"><td>' + esc(x.IdCosto) + '</td><td>' + fecha(x.Fecha) + '</td><td>' + esc(x.Comprobante) + '</td><td>' + esc(x.Insumo) + '</td><td>' + esc(x.TipoCosto) + '</td><td>' + esc(etiqueta('D_Subunidad', x.IdSubunidad)) + '</td><td class="n">' + num(x.Cantidad) + '</td><td class="n">' + pesos(x.PrecioUnit) + '</td><td class="n">' + pesos(x.Importe) + '</td><td>' + esc(x.EsSupuesto) + '</td><td class="muted">' + esc(x.Fuente) + '</td></tr>'; });
    h += '</table></div></details></div>';
    m.innerHTML = h;
  }).catch(function (e) { msg(m, 'err', e.message); });
}

/* ---------- ADMINISTRACIÓN: formularios genéricos (se arman solos a partir del esquema) ---------- */
function campoHTML(tabla, c, valor, bloqueado) {
  var id = 'fld_' + c.n, v = valor === undefined || valor === null ? '' : valor;
  var lab = '<label>' + esc(c.l || c.n) + (c.req ? ' <span class="req">*</span>' : '') + '</label>';
  var dis = bloqueado ? ' disabled' : '';
  var input;
  if (c.fk) {
    var ops = L(c.fk);
    if (c.fk === 'D_Animal') ops = ops.filter(function (x) { return x.estado === 'Activo' || String(x.id) === String(v); });
    input = '<select id="' + id + '"' + dis + '>' + opciones(ops, v) + '</select>';
  } else if (c.t === 'enum') {
    input = '<select id="' + id + '"' + dis + '><option value="">— elegir —</option>' + c.opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  } else if (c.t === 'bool') {
    input = '<select id="' + id + '"' + dis + '><option value="">— elegir —</option><option' + (v === 'Sí' ? ' selected' : '') + '>Sí</option><option' + (v === 'No' ? ' selected' : '') + '>No</option></select>';
  } else {
    var type = c.t === 'num' ? 'number" step="any' : c.t === 'date' ? 'date' : c.t === 'email' ? 'email' : 'text';
    input = '<input id="' + id + '" type="' + type + '" value="' + esc(v) + '"' + dis + '>';
  }
  return '<div class="f">' + lab + input + '</div>';
}
function formulario(tabla, registro, alGuardar) {
  var e = S.esq[tabla], edit = !!registro;
  var cols = e.cols.filter(function (c) { return !c.calc && !(c.n === e.pk && !e.pkManual); });
  var h = '<div id="fMsg"></div><div class="row">';
  cols.forEach(function (c) {
    var bloq = (edit && e.pkManual && c.n === e.pk) || (edit && e.editablesDespues && e.editablesDespues.indexOf(c.n) < 0);
    var val = registro ? registro[c.n] : '';
    if (!edit && c.n === 'IdSubunidad' && e.hecho && S.u.Rol === 'Responsable de subunidad') { val = S.u.IdSubunidad; bloq = true; }
    if (!edit && c.t === 'date' && c.n === 'Fecha') val = hoy();
    h += campoHTML(tabla, c, val, bloq);
  });
  if (tabla === 'S_Usuarios' && !edit) h += '<div class="f"><label>Clave inicial <span class="req">*</span></label><input id="fld_ClaveNueva" type="text" placeholder="mínimo 6 caracteres"></div>';
  h += '</div><button class="btn" id="fBtn">' + (edit ? 'Guardar cambios' : 'Guardar') + '</button> <span class="muted">Los números de Id, la campaña y los importes los completa el sistema.</span>';
  return { html: h, enlazar: function () {
    $('fBtn').onclick = function () {
      var o = {};
      cols.forEach(function (c) { var el = $('fld_' + c.n); if (el) o[c.n] = el.value; });
      if ($('fld_ClaveNueva')) o.ClaveNueva = $('fld_ClaveNueva').value;
      var faltan = cols.filter(function (c) { return c.req && !o[c.n] && !(edit && e.editablesDespues); }).map(function (c) { return c.l || c.n; });
      if (faltan.length) { msg($('fMsg'), 'err', 'Falta completar: ' + faltan.join(', ')); return; }
      $('fBtn').disabled = true;
      var p = edit ? call('api_editar', S.token, tabla, registro[e.pk], o) : call('api_crear', S.token, tabla, o);
      p.then(function (r) { msg($('fMsg'), 'ok', r.mensaje); return refrescar().then(function () { if (alGuardar) alGuardar(r); }); })
       .catch(function (er) { msg($('fMsg'), 'err', er.message); })
       .then(function () { if ($('fBtn')) $('fBtn').disabled = false; });
    };
  } };
}
function vTablas(tabla) {
  var visibles = Object.keys(S.esq).filter(function (t) { return S.esq[t].puede.leer; });
  tabla = tabla || S.tabla || 'D_Animal';
  if (visibles.indexOf(tabla) < 0) tabla = visibles[0];
  S.tabla = tabla;
  var e = S.esq[tabla];
  var grupos = {};
  visibles.forEach(function (t) { (grupos[S.esq[t].grupo] = grupos[S.esq[t].grupo] || []).push(t); });
  var h = volverBtn() + '<div class="card"><h2>Administración</h2><p class="sub">Acá se ven y se corrigen todas las tablas del sistema. Nada se borra: se da de baja y queda registrado quién lo hizo.</p><div class="row"><div class="f" style="max-width:380px"><label>Tabla</label><select onchange="vTablas(this.value)">' +
    Object.keys(grupos).map(function (g) { return '<optgroup label="' + g + '">' + grupos[g].map(function (t) { return '<option value="' + t + '"' + (t === tabla ? ' selected' : '') + '>' + esc(S.esq[t].titulo) + ' (' + t + ')</option>'; }).join('') + '</optgroup>'; }).join('') +
    '</select></div><div class="f" style="max-width:260px"><label>Buscar</label><input id="tBus" oninput="tFiltrar()" placeholder="filtrar filas…"></div><div class="f" style="flex:0 0 auto"><label class="muted"><input type="checkbox" id="tBajas" onchange="tFiltrar()" style="width:auto;min-height:0"> ver dados de baja</label></div>' +
    '<div class="f" style="flex:0 0 auto"><div class="row"><button class="btn2" onclick="tExportar()">Exportar CSV</button>' + (e.puede.crear && !e.soloFormulario ? '<button class="btn" onclick="tNuevo()">＋ Nuevo</button>' : '') + '</div></div></div>' +
    (e.soloFormulario ? '<p class="muted">Estos registros se cargan desde su botón en la pantalla de inicio (así se actualiza todo lo relacionado).</p>' : '') + '</div>' +
    '<div id="tForm"></div><div class="card"><div id="tMsg"></div><div id="tGrid">Cargando…</div></div>';
  $('main').innerHTML = h;
  call('api_listar', S.token, tabla).then(function (rows) { S.filas = rows; tFiltrar(); }).catch(function (er) { msg($('tGrid'), 'err', er.message); });
}
function tCols() { var e = S.esq[S.tabla]; var c = e.cols.map(function (x) { return x.n; }); return S.tabla === 'S_Auditoria' ? c : c.concat(['CreadoEl', 'CreadoPor', 'ModificadoEl', 'ModificadoPor', 'Activo']); }
function tTitulo(n) { var col = S.esq[S.tabla].cols.filter(function (k) { return k.n === n; })[0]; return col && col.l ? col.l : n; }
function tValor(c, x) {
  var col = S.esq[S.tabla].cols.filter(function (k) { return k.n === c; })[0];
  var v = x[c];
  if (col && col.fk && v !== '' && col.fk.indexOf('D_') === 0) return etiqueta(col.fk, v) + (String(etiqueta(col.fk, v)) !== String(v) ? ' (' + v + ')' : '');
  return v;
}
function tFiltrar() {
  var q = ($('tBus').value || '').toLowerCase(), bajas = $('tBajas').checked, e = S.esq[S.tabla], cols = tCols();
  var rows = (S.filas || []).filter(function (x) { return (bajas || x.Activo !== 'No') && (!q || JSON.stringify(x).toLowerCase().indexOf(q) >= 0); });
  var h = '<p class="muted">' + rows.length + ' filas</p><div class="scroll"><table><tr><th></th>' + cols.map(function (c) { return '<th>' + esc(tTitulo(c)) + '</th>'; }).join('') + '</tr>';
  rows.forEach(function (x) {
    var id = x[e.pk];
    var acc = (x._puedeEditar && x.Activo !== 'No' ? '<button class="link" onclick="tEditar(\'' + esc(id) + '\')">Editar</button> ' : '') +
      (x._puedeBaja ? '<button class="link" onclick="tBaja(\'' + esc(id) + '\',' + (x.Activo === 'No') + ')">' + (x.Activo === 'No' ? 'Reactivar' : 'Dar de baja') + '</button> ' : '') +
      (S.tabla === 'S_Usuarios' && S.u.Rol === 'Administrador' ? '<button class="link" onclick="tReset(\'' + esc(id) + '\')">Nueva clave</button>' : '');
    h += '<tr class="' + (x.Activo === 'No' ? 'baja' : '') + (x.EsSupuesto === 'Sí' ? ' sup' : '') + '"><td style="white-space:nowrap">' + acc + '</td>' + cols.map(function (c) { var tv = esc(tValor(c, x)); return '<td title="' + tv + '">' + tv + '</td>'; }).join('') + '</tr>';
  });
  $('tGrid').innerHTML = h + '</table></div>';
}
function tNuevo() {
  var f = formulario(S.tabla, null, function () { setTimeout(function () { vTablas(S.tabla); }, 1200); });
  $('tForm').innerHTML = '<div class="card"><h2>Nuevo registro en ' + esc(S.esq[S.tabla].titulo) + '</h2>' + f.html + ' <button class="btn2" onclick="$(\'tForm\').innerHTML=\'\'">Cancelar</button></div>';
  f.enlazar(); $('tForm').scrollIntoView();
}
function tEditar(id) {
  var e = S.esq[S.tabla];
  var r = S.filas.filter(function (x) { return String(x[e.pk]) === String(id); })[0];
  var f = formulario(S.tabla, r, function () { setTimeout(function () { vTablas(S.tabla); }, 1200); });
  $('tForm').innerHTML = '<div class="card"><h2>Editar ' + esc(id) + '</h2>' + f.html + ' <button class="btn2" onclick="$(\'tForm\').innerHTML=\'\'">Cancelar</button></div>';
  f.enlazar(); $('tForm').scrollIntoView();
}
function tBaja(id, activar) {
  var extra = { F_Ingresos: ' El animal vuelve al rodeo.', F_Mortandad: ' El animal vuelve al rodeo.', F_Compras: ' También se dan de baja sus renglones de costo.', F_Sanidad: ' También se da de baja el consumo que generó.' }[S.tabla] || '';
  var txt = activar ? '¿Reactivar ' + id + '?' : '¿Dar de baja ' + id + '? No se borra: queda marcado como inactivo y registrado en la auditoría.' + extra;
  if (!window.confirm(txt)) return;
  call('api_baja', S.token, S.tabla, id, activar).then(function (r) { return refrescar().then(function () { vTablas(S.tabla); setTimeout(function () { msg($('tMsg'), 'ok', r.mensaje); }, 600); }); })
    .catch(function (er) { msg($('tMsg'), 'err', er.message); });
}
function tReset(email) {
  var c = window.prompt('Nueva clave para ' + email + ' (mínimo 6 caracteres). Pasásela a la persona para que la cambie al entrar:');
  if (!c) return;
  call('api_resetearClave', S.token, email, c).then(function (r) { msg($('tMsg'), 'ok', r.mensaje); }).catch(function (er) { msg($('tMsg'), 'err', er.message); });
}
function tExportar() {
  var cols = tCols();
  var lineas = [cols.join(';')].concat((S.filas || []).map(function (x) { return cols.map(function (c) { var v = String(x[c] === undefined ? '' : x[c]); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }));
  var blob = new Blob(['﻿' + lineas.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = S.tabla + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- MI CLAVE ---------- */
function vClave() {
  $('main').innerHTML = volverBtn() + '<div class="card" style="max-width:460px"><h2>Cambiar mi clave</h2><div id="kMsg"></div>' + campo('Clave actual', '<input id="kA" type="password">') +
    campo('Clave nueva (mínimo 6)', '<input id="kN" type="password">') + '<button class="btn full" onclick="kGuardar()">Guardar</button></div>';
}
function kGuardar() { call('api_cambiarClave', S.token, $('kA').value, $('kN').value).then(function (r) { msg($('kMsg'), 'ok', r.mensaje); }).catch(function (e) { msg($('kMsg'), 'err', e.message); }); }

if (S.token) iniciar().catch(function () { salir(true); });
</script>
